name: Pud verification
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run setup:lean
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - run: bun run test
      - name: Check supported Lean examples
        run: find packages/pud/.examples -name '*.proof.ts' ! -name sum-positive.proof.ts -exec bun run pud check {} +
