name: Publish Pud to npm

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check the release tag
        run: |
          version=$(jq -r .version packages/pud/package.json)
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun run setup
      - run: bun run pack:cli
      - name: Check a proof with the packed release
        env:
          ELAN_HOME: ${{ github.workspace }}/.cache/elan
          npm_config_cache: ${{ runner.temp }}/npm-offline
        run: |
          archive="$GITHUB_WORKSPACE/dist/pud.dev-${GITHUB_REF_NAME#v}.tgz"
          consumer=$(mktemp -d)
          cp packages/pud/.examples/{pud.config.ts,lean-toolchain,clamp.ts,clamp.proof.ts} "$consumer/"
          cd "$consumer"
          npm install --offline --ignore-scripts --no-audit --no-fund "$archive"
          export PATH="$ELAN_HOME/bin:$PATH"
          npx --offline pud check clamp.proof.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: npm-release
          path: dist/pud.dev-*.tgz
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.3' # Includes npm 11.19.1 for trusted publishing
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: npm-release
      - name: Publish the verified archive
        run: npm publish "./pud.dev-${GITHUB_REF_NAME#v}.tgz" --access public
