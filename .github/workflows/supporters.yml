name: Update supporter roll

on:
  issue_comment:
    types: [created, deleted]
  push:
    branches: [main]
    paths:
      - .github/workflows/supporters.yml
      - scripts/sync-supporters.ts
      - apps/www/features/supporters/roster.ts
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  reconcile:
    if: >-
      github.repository == 'PudHQ/pud' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'issue_comment' ||
       (!github.event.issue.pull_request && github.event.issue.number == 17))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pud-supporter-roll
      cancel-in-progress: false
    permissions:
      contents: write
      issues: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { syncSupporters } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/sync-supporters.ts`);
            core.info(await syncSupporters(github.graphql, context.repo, "main"));
