name: Bug report
description: Report unexpected behavior in Pud, PudDex, or the Pud website.
labels: [bug]
body:
  - type: textarea
    id: expected-behavior
    attributes:
      label: What do you expect to happen (what should happen)?
      description: >-
        Make sure you include what part of Pud this relates to.
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: What actually happens?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce it?
      description: >-
        List the steps or share a minimal example. For proof issues, include the TypeScript
        being checked, its `.proof.ts` file, and the `pud.dev check` command if you can.
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: >-
        Paste relevant logs or attach a screenshot. For proof issues, include the output
        from `pud.dev check --verbose` if available.
